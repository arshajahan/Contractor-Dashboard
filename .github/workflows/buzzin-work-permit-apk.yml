name: Buzzin Work Permit APK
on:
  workflow_dispatch:
  push:
    paths: ['buzzin-work-permit/**']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buzzin-work-permit/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: buzzin-work-permit-debug-apk
          path: buzzin-work-permit/android/app/build/outputs/apk/debug/app-debug.apk
