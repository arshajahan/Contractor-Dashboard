<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs></defs><rect width="100%" height="100%" fill="rgb(244, 246, 250)"/><g data-name="app"><g data-name="modal-page"><g data-name="card modal-card"><rect x="415" y="52" width="610" height="850.5" rx="16" fill="rgb(255, 255, 255)" stroke="rgb(220, 227, 236)" stroke-width="1"/><g data-name="row between"><g data-name="H1"><text x="440" y="105.24" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">Before you start</text></g><g data-name="btn ghost"><text x="958.484375" y="103.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" font-style="normal" fill="rgb(36, 91, 152)" xml:space="preserve">Close</text></g></g><g data-name="stack"><g data-name="notice "><rect x="440" y="145" width="560" height="107.5" rx="12" fill="rgb(255, 245, 219)" stroke="rgb(240, 220, 165)" stroke-width="1"/><svg x="461" y="165" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7h.01"></path></svg><g data-name="DIV"><g data-name="STRONG"><text x="495" y="177.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">General work permit</text></g><g data-name="P"><text x="495" y="204.48" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="rgb(83, 99, 117)" xml:space="preserve">These are the sample requirements for Buzzin community. Prepare your files</text><text x="495" y="225.48" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="rgb(83, 99, 117)" xml:space="preserve">before starting.</text></g></g></g><g data-name="card"><rect x="440" y="268.5" width="560" height="197" rx="16" fill="rgb(255, 255, 255)" stroke="rgb(220, 227, 236)" stroke-width="1"/><g data-name="card-heading"><g data-name="H2"><text x="465" y="310.4" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">Required documents</text></g></g><g data-name="checklist-item"><svg x="465" y="340.5" width="22" height="22" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></svg><g data-name="DIV"><g data-name="STRONG"><text x="499" y="354.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">Scope of Work Form</text></g><g data-name="small"><text x="499" y="379.66" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="rgb(101, 116, 136)" xml:space="preserve">Describe the tasks and work area. Use the community template.</text></g><g data-name="btn ghost"><svg x="652.390625" y="406.5" width="20" height="20" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"></path></svg><text x="682.390625" y="419.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" font-style="normal" fill="rgb(36, 91, 152)" xml:space="preserve">Download template</text></g></g></g></g><g data-name="card"><rect x="440" y="481.5" width="560" height="211" rx="16" fill="rgb(255, 255, 255)" stroke="rgb(220, 227, 236)" stroke-width="1"/><g data-name="card-heading"><g data-name="H2"><text x="465" y="523.4" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">You may also need</text></g></g><g data-name="checklist-item"><svg x="465" y="553.5" width="22" height="22" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h5"></path></svg><g data-name="DIV"><g data-name="STRONG"><text x="499" y="567.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">Risk assessment</text></g><g data-name="small"><text x="499" y="592.66" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="rgb(101, 116, 136)" xml:space="preserve">Upload it if requested for your work.</text></g></g></g><g data-name="checklist-item"><svg x="465" y="620.5" width="22" height="22" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 6"></path></svg><g data-name="DIV"><g data-name="STRONG"><text x="499" y="634.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">Current worker IDs</text></g><g data-name="small"><text x="499" y="659.66" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="rgb(101, 116, 136)" xml:space="preserve">Check that selected workers’ documents cover the work dates.</text></g></g></g></g><g data-name="small"><text x="440" y="720.66" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="rgb(101, 116, 136)" xml:space="preserve">Documents with no expiry can be marked “No expiry date”. Only named documents configured</text><text x="440" y="739.66" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="rgb(101, 116, 136)" xml:space="preserve">by this community are shown.</text></g><g data-name="btn primary"><rect x="440" y="763.5" width="560" height="48" rx="10" fill="rgb(255, 182, 36)" stroke="rgb(23, 40, 59)" stroke-width="0"/><text x="613.6875" y="790.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">I have these ready — continue</text></g><g data-name="btn secondary"><rect x="440" y="827.5" width="560" height="50" rx="10" fill="rgb(255, 255, 255)" stroke="rgb(220, 227, 236)" stroke-width="1"/><text x="646.171875" y="855.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">Save and return later</text></g></g></g></g></g></svg>