igured by this</text><text x="41" y="758.66" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="rgb(101, 116, 136)" xml:space="preserve">community are shown.</text></g><g data-name="btn primary"><rect x="41" y="782" width="308" height="48" rx="10" fill="rgb(255, 182, 36)" stroke="rgb(23, 40, 59)" stroke-width="0"/><text x="88.6875" y="808.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">I have these ready — continue</text></g><g data-name="btn secondary"><rect x="41" y="846" width="308" height="50" rx="10" fill="rgb(255, 255, 255)" stroke="rgb(220, 227, 236)" stroke-width="1"/><text x="121.171875" y="873.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" font-style="normal" fill="rgb(23, 40, 59)" xml:space="preserve">Save and return later</text></g></g></g></g></g></g></svg>