function upload(id,title,required=false){const filename=files[id]?.name||draft[id+'File']||'No file selected';return '<div class="upload">'+icon('file')+'<div><strong>'+title+'</strong><p class="small" id="'+id+'Name">'+esc(filename)+'</p></div></div><div class="upload-actions"><button type="button" class="btn secondary" data-upload="'+id+'">'+icon('plus')+'Choose file</button><button type="button" class="btn ghost" data-preview="'+id+'">Preview</button><button type="button" class="btn ghost" data-remove="'+id+'">Remove</button></div><input class="file-input" id="file-'+id+'" type="file" accept=".pdf,.jpg,.jpeg,.png" data-file="'+id+'"><span class="hint">PDF, JPG or PNG · Up to 10 MB in this preview'+(required?' · Required':'')+'</span>'}

function pdf(saved){return steps(6)+notice(saved?'All document changes saved':'One signature is still needed',saved?'3 of 3 pages complete. You can now review your request.':'Fill the fields on each page. Your progress is saved on this device.',saved?'green':'blue')+'<div class="row">'+btn('Fill fields','pdf','primary')+btn('Add signature','sign','secondary')+'<button class="btn secondary" data-demo>Download preview</button></div><div class="document-layout"><aside class="page-rail">'+[1,2,3].map(i=>'<button class="page-thumb '+(i===pdfPage?'active':'')+'" data-page="'+i+'"><strong>Page '+i+'</strong><span class="small">'+(i===3&&!saved?'Signature needed':'Complete ✓')+'</span></button>').join('')+'</aside><section class="paper"><div class="row between"><div class="brand">buzz<span>in</span></div><small>Sample document · Page '+pdfPage+' of 3</small></div><h2>'+['Work declaration','Site safety checklist','Contractor declaration'][pdfPage-1]+'</h2><p class="muted">Buzzin community · General work permit</p>'+notice('Design preview','The community supplies the final terms. This sample demonstrates filling, notes and signatures.')+field('pdfCompany'+pdfPage,'Company name *','Sample Contracting LLC')+field('pdfContact'+pdfPage,'Responsible person *','Alex Morgan')+field('pdfNote'+pdfPage,'Add a note','Work area will be secured and left clean.','','textarea')+check('pdfAgree'+pdfPage,'I have read and agree to the terms on this page.',saved)+'<div class="signature-box">'+(saved?'<div class="signature-preview">'+esc(draft.signer||'Alex Morgan')+'</div>':btn('Add required signature','sign','secondary'))+'</div><div class="row between"><span class="save-status">✓ Changes saved on this device</span>'+btn(saved?'Review request':'Go to signature',saved?'review':'sign','primary')+'</div></section></div>';}

case 'people':return '<div class="toolbar">'+field('peopleSearch','Search people','','Name or ID reference')+btn('Add a person','addPerson','primary','plus')+'</div>'+card('Alex Morgan','<p class="muted">Technician · Sample Contracting LLC</p>'+status('Ready')+'<p>ID valid until 31 Dec 2026</p>'+btn('Edit details','addPerson','secondary'));
case 'addPerson':return card('Person details','<div class="grid2">'+field('personName','Full name *','Alex Morgan')+field('personRole','Role','Technician')+field('personPhone','Contact number','+971 50 000 0000','','tel')+field('idNumber','ID reference *','Sample ID 001')+field('idExpiry','ID expiry date *','2026-12-31','Must cover the work dates.','date')+'</div>'+upload('workerId','Worker ID',true)+btn('Save person','people','primary'));
case 'vehicles':return '<div class="toolbar">'+field('vehicleSearch','Search vehicles','','Plate number or vehicle type')+btn('Add a vehicle','addVehicle','primary','plus')+'</div>'+card('Delivery van · Sample 12345','<p class="muted">White · Light vehicle</p>'+status('Ready')+'<p>Registration valid until 31 Dec 2026</p>'+btn('Edit details','addVehicle','secondary'));
case 'addVehicle':return card('Vehicle details','<div class="grid2">'+field('plate','Plate number *','Sample 12345')+field('vehicleType','Vehicle type *','Van','','text',['Van','Car','Truck'])+field('vehicleColor','Colour','White')+field('registrationExpiry','Registration expiry *','2026-12-31','','date')+'</div>'+upload('vehicleFront','Registration front',true)+upload('vehicleBack','Registration back',true)+btn('Save vehicle','vehicles','primary'));
case 'settings':return card('Company details','<div class="grid2">'+field('companyName','Company name *','Sample Contracting LLC')+field('companyEmail','Company email *','contractor@example.com','','email')+field('companyPhone','Phone number','+971 50 000 0000','','tel')+field('companyAddress','Company address','Dubai')+'</div>'+btn('Save company details','','primary'))+doc('license','Trade licence',true)+doc('insurance','Insurance certificate',false)+card('Your account',field('profileName','Full name','Alex Morgan')+field('profileEmail','Email','contractor@example.com','','email')+btn('Save profile','','primary')+btn('Change password','password','secondary'));

case 'help':return card('Buzzin community','<p>For permit questions, contact your community and include your request reference.</p>'+notice('Community contact email','The live dashboard should show the support email configured by Buzzin community. No real email address is used in this design preview.')+field('supportRef','Request reference','BZ-1048')+field('supportMessage','Your question','','','textarea')+btn('Copy reference','','secondary')+btn('Back to my permits','permits','ghost'));

function render(){let k=key();if(!names[k])k='home';const wizard=journey.includes(k)||['pdfSaved','validation','documentsNoExpiry','sign'].includes(k);let navKey=['people','addPerson'].includes(k)?'people':['vehicles','addVehicle'].includes(k)?'vehicles':k==='home'?'home':k==='settings'?'settings':'permits';const nav=[['Overview','home','home'],['My permits','permits','permit'],['People','people','people'],['Vehicles','vehicles','car'],['Company & account','settings','building']];document.title=names[k]+' · Buzzin';document.getElementById('app').innerHTML='<div class="preview-banner">Interactive design preview · Sample data · Nothing is sent to the community</div>'+(k==='permitChecklist'?'<main class="modal-page"><section class="card modal-card"><div class="row between"><h1>'+names[k]+'</h1>'+btn('Close','details','ghost')+'</div>'+content(k)+'</section></main>':'<div class="shell"><aside class="side"><div><div class="brand">buzz<span>in</span></div><p class="small">CONTRACTOR PORTAL</p></div>'+btn('Request permit','type','primary','plus')+'<nav class="nav">'+nav.map(r=>'<button class="'+(r[1]===navKey?'active':'')+'" data-go="'+r[1]+'">'+r[0]+'</button>').join('')+'</nav><div class="support"><strong>Need a hand?</strong><p>Buzzin community can help with your permit.</p>'+btn('Contact community','help','secondary')+'</div><p class="small">Sample Contracting LLC</p></aside><div class="workspace"><header class="top"><div class="community"><button class="menu-btn" data-go="menu" aria-label="Open menu">'+icon('menu')+'</button><div class="community-mark">'+icon('building')+'</div><div><span class="small">Your community</span><br><strong>Buzzin community</strong></div></div><div class="top-right">'+btn('Switch community','community','ghost')+'<div class="avatar">AM</div></div></header><main class="main"><div class="page-head"><div><h1>'+names[k]+'</h1><p>'+(subtitles[k]||'Manage your request with Buzzin community.')+'</p></div>'+(k==='home'?btn('Request permit','type','primary','plus'):'')+'</div>'+(wizard&&k!=='sign'?'<button class="btn ghost save-top" data-save>Save and finish later</button>':'')+'<div id="formErrors" class="notice red error-summary" role="alert"></div>'+content(k)+'</main>'+actions(k)+(!wizard?'<nav class="mobile-nav">'+nav.slice(0,4).map(r=>'<button class="'+(r[1]===navKey?'active':'')+'" data-go="'+r[1]+'">'+icon(r[2])+r[0]+'</button>').join('')+'</nav>':'')+'</div></div>');bind();window.scrollTo(0,0);}
function save(){try{localStorage.setItem('buzzin-design-draft',JSON.stringify(draft));document.querySelectorAll('.save-status').forEach(el=>el.textContent='✓ Draft saved on this device')}catch(e){toast('Storage is unavailable. Keep this preview open to retain your changes.')}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',4000)}
function go(k){location.hash=k;if(key()===k)render()}
function errors(messages){const el=document.getElementById('formErrors');el.classList.add('visible');el.innerHTML=icon('info')+'<div><strong>Please check before continuing</strong><p>'+messages.join('<br>')+'</p></div>';el.scrollIntoView({behavior:'smooth',block:'center'});}
function next(target){let k=key(),e=[];if(['details','validation'].includes(k)){if(!draft.work&&!document.getElementById('work').value.trim())e.push('Enter a short description of the work.');const unit=document.getElementById('unit').value;if(unit==='Choose a unit')e.push('Choose the main unit.');const start=document.getElementById('start').value,end=document.getElementById('end').value;if(!start||!end||end<start)e.push('Choose an end date on or after the start date.');const min=new Date();min.setDate(min.getDate()+2);min.setHours(0,0,0,0);if(new Date(start+'T00:00:00')<min)e.push('Choose a start date at least two days ahead for this sample.');}if(['documents','documentsNoExpiry'].includes(k)){if(!draft.scopeFile)e.push('Upload the required Scope of Work Form.');for(const id of ['scope','risk'])if(draft[id+'File']&&!draft[id+'NoExpiry']){let d=document.getElementById(id+'Expiry').value;if(!d)e.push('Enter the '+id+' expiry date, or choose No expiry date.');else if(d<(draft.end||'2026-10-16'))e.push('The '+id+' document must cover the work end date.');}}if(k==='review'){if(!document.querySelector('[data-field=finalConsent]').checked)e.push('Confirm that the information is correct.');if(!draft.signatureSaved)e.push('Save your signature before submitting.');}if(e.length){errors(e);return}if(target==='submitted'){draft.reference=draft.reference||'BZ-DEMO-'+String(Date.now()).slice(-5);draft.submitted=true;save()}go(target)}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));document.querySelectorAll('[data-demo]').forEach(el=>el.onclick=()=>toast('Design preview: this action will connect to the live service during implementation.'));document.querySelectorAll('[data-save]').forEach(el=>el.onclick=()=>{save();toast('Your draft is saved on this device.');});document.querySelectorAll('[data-next]').forEach(el=>el.onclick=()=>next(el.dataset.next));document.querySelectorAll('[data-field]').forEach(el=>{el.oninput=()=>{const id=el.dataset.field;draft[id]=el.type==='checkbox'?el.checked:el.value;save();if(id==='signer'){const sig=document.getElementById('typedSignature');if(sig)sig.textContent=el.value}if(id.startsWith('pdf')&&draft.signatureSaved){draft.signatureSaved=false;save();const proceed=document.querySelector('[data-next]');if(proceed){proceed.disabled=true;proceed.textContent='Confirm signature to continue'}const savedNotice=document.querySelector('.notice.green');if(savedNotice){savedNotice.className='notice red';savedNotice.querySelector('strong').textContent='Please confirm your signature again';savedNotice.querySelector('p').textContent='The document changed after signing. Open Add signature and save it again.'}toast('Document changed. Please confirm your signature again.')}};el.onchange=()=>{el.oninput();if(el.dataset.field.endsWith('NoExpiry')){const id=el.dataset.field.replace('NoExpiry',''),date=document.getElementById(id+'Expiry');date.disabled=el.checked;date.type=el.checked?'text':'date';date.value=el.checked?'Not applicable':draft[id+'Expiry']||'2026-12-31';date.nextElementSibling.textContent=el.checked?'This document has no expiry date.':'Use the expiry printed on the document.';}if(el.dataset.field==='permitType')go('permitChecklist');if(el.dataset.field==='property'){draft.unit='Choose a unit';save();document.getElementById('unit').value='Choose a unit';toast('Choose a unit for the selected property.')}}});document.querySelectorAll('[data-upload]').forEach(el=>el.onclick=()=>document.getElementById('file-'+el.dataset.upload).click());document.querySelectorAll('[data-file]').forEach(el=>el.onchange=()=>{let f=el.files[0],id=el.dataset.file;if(!f)return;if(!/\.(pdf|jpe?g|png)$/i.test(f.name)||f.size>10*1024*1024){toast('Choose a PDF, JPG or PNG up to 10 MB.');return}files[id]=f;draft[id+'File']=f.name;save();document.getElementById(id+'Name').textContent=f.name;toast('File selected. This prototype saves its name; upload storage is part of implementation.')});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{delete files[el.dataset.remove];delete draft[el.dataset.remove+'File'];save();render()});document.querySelectorAll('[data-preview]').forEach(el=>el.onclick=()=>{let f=files[el.dataset.preview];if(f)window.open(URL.createObjectURL(f),'_blank','noopener');else toast('Choose a file in this session to preview it.')});document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{pdfPage=+el.dataset.page;render()});document.querySelectorAll('[data-sign-mode]').forEach(el=>el.onclick=()=>{signatureMode=el.dataset.signMode;render()});const canvas=document.getElementById('signature');if(canvas){const ctx=canvas.getContext('2d');ctx.strokeStyle='#17283B';ctx.lineWidth=2.5;ctx.lineCap='round';if(draft.signatureImage){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=draft.signatureImage}let drawing=false;const pos=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};canvas.onpointermove=e=>{if(drawing){ctx.lineTo(...pos(e));ctx.stroke();draft.hasDrawing=true}};canvas.onpointerup=()=>{drawing=false;draft.signatureImage=canvas.toDataURL();save()};canvas.onpointercancel=()=>drawing=false}document.querySelectorAll('[data-sign-clear]').forEach(el=>el.onclick=()=>{draft.hasDrawing=false;delete draft.signatureImage;if(canvas)canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);else{draft.signer='';document.getElementById('signer').value='';document.getElementById('typedSignature').textContent=''}save()});document.querySelectorAll('[data-sign-save]').forEach(el=>el.onclick=()=>{const name=document.getElementById('signer').value.trim();if(!name||!document.querySelector('[data-field=signatureConfirm]').checked||(signatureMode==='draw'&&!draft.hasDrawing)){errors(['Enter your name, add a signature and confirm it before saving.']);return}draft.signatureSaved=true;draft.signer=name;save();go('pdfSaved')});const search=document.getElementById('search');if(search)search.oninput=()=>{document.querySelectorAll('[data-status]').forEach(el=>{const match=el.textContent.toLowerCase().includes(search.value.toLowerCase()),filter=draft.statusFilter||'All statuses';el.style.display=match&&(filter==='All statuses'||el.dataset.status===filter)?'':'none'})};}

if(!draft.items)draft.items=[{name:'Portable ladder',type:'Equipment',quantity:1,removal:'Yes',notes:''}];
content=function(k){if(k==='home')return originalContent(k).replace('class="grid3"','class="grid3 home-metrics"');if(k==='materials'){const items=draft.items||[];return steps(2)+notice('List what you will bring','Add each material or equipment item. You can add more than one.')+card('Materials & equipment','<div class="add-item-bar"><span class="item-count">'+items.length+' '+(items.length===1?'item':'items')+' added</span><button class="btn primary" data-add-item>'+icon('plus')+'Add item</button></div>'+check('noMaterials','No materials or equipment needed')+(items.length?items.map((it,i)=>'<article class="material-item"><div class="row between"><h3>'+esc(it.name)+'</h3><span class="status draft">'+esc(it.type)+'</span></div><p class="muted">Quantity: '+it.quantity+' · '+(it.removal==='Yes'?'Removed after work':'Remains on site')+'</p><div class="row"><button class="btn secondary" data-edit-item="'+i+'">Edit item</button><button class="btn ghost" style="color:var(--red)" data-remove-item="'+i+'">Remove</button></div></article>').join(''):'<div class="empty">'+icon('file')+'<h3>No items added yet</h3><p class="muted">Tap Add item, or choose None needed.</p></div>'));}if(k==='addMaterial'){return card(editIndex<0?'New item':'Edit item','<div class="grid2">'+field('itemName','Item name *',draft.itemName||'')+field('itemType','Type *','Equipment','','text',['Equipment','Material'])+field('quantity','Quantity *',draft.quantity||'1','Use a whole number greater than zero.','number')+field('itemRemoval','Will it be removed?','Yes','','text',['Yes','No'])+'</div>'+field('itemNotes','Notes',draft.itemNotes||'','','textarea')+'<div class="row"><button class="btn primary" data-save-item>Save item</button>'+btn('Cancel','materials','secondary')+'</div>');}return originalContent(k)};
const originalBind=bind;bind=function(){originalBind();const summary=document.getElementById('jobSummary');if(summary)summary.maxLength=40;document.querySelectorAll('[data-add-item]').forEach(el=>el.onclick=()=>{editIndex=-1;draft.itemName='';draft.quantity='1';draft.itemNotes='';go('addMaterial')});document.querySelectorAll('[data-edit-item]').forEach(el=>el.onclick=()=>{editIndex=+el.dataset.editItem;const it=draft.items[editIndex];Object.assign(draft,{itemName:it.name,itemType:it.type,quantity:String(it.quantity),itemRemoval:it.removal,itemNotes:it.notes});go('addMaterial')});document.querySelectorAll('[data-remove-item]').forEach(el=>el.onclick=()=>{let i=+el.dataset.removeItem,removed=draft.items.splice(i,1)[0];save();render();toast('Item removed.');window.lastRemoved={item:removed,index:i};const t=document.getElementById('toast'),undo=document.createElement('button');undo.textContent='Undo';undo.className='btn ghost';undo.style.color='#FFB624';undo.onclick=()=>{draft.items.splice(window.lastRemoved.index,0,window.lastRemoved.item);save();render();toast('Item restored.')};t.appendChild(undo)});document.querySelectorAll('[data-save-item]').forEach(el=>el.onclick=()=>{const name=document.getElementById('itemName').value.trim(),qty=+document.getElementById('quantity').value;if(!name||!Number.isInteger(qty)||qty<=0){errors(['Enter an item name and a whole-number quantity greater than zero.']);return}const it={name,type:document.getElementById('itemType').value,quantity:qty,removal:document.getElementById('itemRemoval').value,notes:document.getElementById('itemNotes').value};if(editIndex<0)draft.items.push(it);else draft.items[editIndex]=it;draft.noMaterials=false;save();go('materials')});};
render=function(){originalRender();const ws=document.querySelector('.workspace');if(ws){const statusbar=document.createElement('div');statusbar.className='phone-status';statusbar.innerHTML='<span>9:41</span><span>▴ ▰ ▰</span>';ws.prepend(statusbar);if(journey.includes(key())||['pdfSaved','validation','documentsNoExpiry','sign','addMaterial','addPerson','addVehicle'].includes(key())){ws.classList.add('wizard');const saveButton=document.createElement('button');saveButton.className='btn ghost mobile-save';saveButton.innerHTML=icon('clock')+'Save';saveButton.onclick=()=>{save();toast('Your draft is saved on this device.')};document.querySelector('.top-right').appendChild(saveButton);const community=document.querySelector('.community');const back=document.createElement('button');back.className='app-back';back.setAttribute('aria-label','Go back');back.textContent='‹';back.onclick=()=>go(key()==='addMaterial'?'materials':key()==='sign'?'pdf':'permits');community.prepend(back);document.querySelector('.menu-btn').classList.add('wizard-menu')}}};
const priorNext=next;next=function(target){if(key()==='pdfSaved'&&!draft.signatureSaved){errors(['Confirm your signature again before continuing.']);return}if(key()==='materials'){if(!draft.items.length&&!draft.noMaterials){errors(['Add at least one item, or choose No materials or equipment needed.']);return}if(draft.items.length&&draft.noMaterials){errors(['You have added items. Uncheck No materials needed, or remove the items.']);return}}priorNext(target)};
