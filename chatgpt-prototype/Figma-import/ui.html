<!doctype html><html><head><style>body{font:14px/1.5 system-ui;padding:20px;color:#17283B}h2{font-size:22px}button{background:#FFB624;border:0;border-radius:8px;padding:14px 20px;font:600 14px system-ui;width:100%;margin-top:20px}select,input{display:block;margin-top:8px;padding:10px;width:100%;box-sizing:border-box}p{color:#657488}#status{background:#F2F5F9;padding:12px;border-radius:8px}</style></head><body><h2>Import the Buzzin redesign</h2><p>Select <b>figma-scenes.json</b> from the downloaded folder. Import into the current page; existing designs are preserved.</p><label>Screen data<input type="file" id="file" accept=".json"></label><label>Choose a layout<select id="device"><option>Mobile</option><option>Desktop</option><option>Tablet</option><option>All</option></select></label><button id="import">Import editable screens</button><p id="status">Ready. No network connection is used.</p><script>document.getElementById('import').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return document.getElementById('status').textContent='Choose figma-scenes.json first.';try{const data=JSON.parse(await f.text());if(!Array.isArray(data.screens))throw Error('Choose the provided screen data file.');parent.postMessage({pluginMessage:{type:'import',data,device:document.getElementById('device').value}},'*');document.getElementById('import').disabled=true}catch(e){document.getElementById('status').textContent=e.message}};window.onmessage=e=>{let m=e.data.pluginMessage;if(!m)return;document.getElementById('status').textContent=m.text;if(m.type==='complete'||m.type==='error')document.getElementById('import').disabled=false}</script></body></html>
