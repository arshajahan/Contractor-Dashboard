e="documents" >Upload your documents</option><option value="documentsNoExpiry" >Upload your documents</option><option value="pdf" >Fill & sign documents</option><option value="sign" >Add your signature</option><option value="pdfSaved" >Fill & sign documents</option><option value="review" >Check your request</option><option value="submitted" >Your request has been received</option><option value="pending" >Request details</option><option value="approved" >Your permit is ready</option><option value="changes" >Update your request</option><option value="people" >Your people</option><option value="addPerson" >Add a person</option><option value="vehicles" >Your vehicles</option><option value="addVehicle" >Add a vehicle</option><option value="settings" >Company & account</option><option value="community" >Choose a community</option><option value="unit" >Choose units</option><option value="filters" >Filter your permits</option><option value="validation" >Tell us about the work</option><option value="help" >Contact your community</option><option value="completion" >Request a final inspection</option><option value="visitor" >Request a visitor pass</option><option value="addMaterial" >Add materials or equipment</option><option value="password" >Change your password</option><option value="menu" >Your contractor portal</option></select></label></div></header><div class="links"><a href="prototype.html#home" target="_blank">Open full interactive prototype</a><a href="START-HERE.md">Figma import instructions</a></div><main class="stage"><iframe id="preview" title="Buzzin interactive design preview" src="prototype.html#materials" width="390" height="844"></iframe></main><script>const preview=document.getElementById('preview');document.getElementById('device').onchange=e=>{const [w,h]=e.target.value.split(',');preview.width=w;preview.height=h;preview.style.borderRadius=w==='390'?'16px':'8px'};document.getElementById('screen').onchange=e=>preview.src='prototype.html#'+e.target.value;</
